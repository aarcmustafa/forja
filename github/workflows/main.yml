name: Build Android TV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check project files
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if client exists
        id: check
        run: |
          if [ -f "client/pubspec.yaml" ] && [ -f "client/lib/main_tv.dart" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✅ المشروع جاهز للبناء"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::warning::⚠️ الملفات الأساسية غير موجودة. شغّل workflow 'Setup Project Structure' أولاً."
          fi

  build-tv:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.ready == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Enable Flutter TV support
        working-directory: client
        run: |
          flutter create --platforms=android . || true

      - name: Build TV APK
        working-directory: client
        run: flutter build apk --release -t lib/main_tv.dart

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp client/build/app/outputs/flutter-apk/app-release.apk \
             artifacts/estitn-farja-tv-${{ github.sha }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: estitn-farja-tv-apk
          path: artifacts/*.apk
          retention-days: 30

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [check, build-tv]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Check Project | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build TV APK | ${{ needs.build-tv.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
