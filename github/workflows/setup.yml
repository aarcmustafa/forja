name: Setup Project Structure

on:
  workflow_dispatch:  # تشغيل يدوي بضغطة زر

permissions:
  contents: write     # للسماح برفع الملفات الجديدة

jobs:
  setup:
    name: 🏗️ Generate Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Make script executable
        run: chmod +x scripts/setup_structure.sh

      - name: 🏗️ Run setup script
        run: bash scripts/setup_structure.sh

      - name: 📋 List generated structure
        run: |
          echo "=== Generated Structure ==="
          find estitn-farja-iptv -type d | head -50
          echo ""
          echo "=== Files count ==="
          find estitn-farja-iptv -type f | wc -l

      - name: 📤 Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estitn-farja-iptv/
          git commit -m "chore: auto-generate project structure" || echo "لا توجد تغييرات"
          git push
