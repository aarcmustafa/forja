name: Setup Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    name: Generate Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories
        run: |
          mkdir -p client/lib/core/constants
          mkdir -p client/lib/core/theme
          mkdir -p client/lib/core/utils
          mkdir -p client/lib/data/models
          mkdir -p client/lib/data/repositories
          mkdir -p client/lib/data/providers
          mkdir -p client/lib/features/live_tv
          mkdir -p client/lib/features/movies
          mkdir -p client/lib/features/series
          mkdir -p client/lib/features/player
          mkdir -p client/lib/tv/screens
          mkdir -p client/lib/tv/widgets
          mkdir -p client/lib/tv/navigation
          mkdir -p client/android/app/src/main/kotlin/com/estitn/farja
          mkdir -p client/android/app/src/mobile
          mkdir -p client/android/app/src/tv/res/drawable
          mkdir -p client/android/app/src/tv/res/values
          mkdir -p server/src/routes
          mkdir -p server/src/middleware
          mkdir -p server/src/config
          mkdir -p data-pipeline/scripts
          mkdir -p data-pipeline/sources
          mkdir -p shared
          mkdir -p docs

      - name: Create pubspec.yaml
        run: |
          cat > client/pubspec.yaml <<'EOF'
          name: estitn_farja
          description: Estetn Farja IPTV - Android TV & Mobile
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Create main_tv.dart
        run: |
          cat > client/lib/main_tv.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const EstetnFarjaTvApp());
          }

          class EstetnFarjaTvApp extends StatelessWidget {
            const EstetnFarjaTvApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Estetn Farja TV',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true),
                home: const Scaffold(
                  body: Center(child: Text('Estetn Farja TV')),
                ),
              );
            }
          }
          EOF

      - name: Create main_mobile.dart
        run: |
          cat > client/lib/main_mobile.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const EstetnFarjaMobileApp());
          }

          class EstetnFarjaMobileApp extends StatelessWidget {
            const EstetnFarjaMobileApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Estetn Farja',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true),
                home: const Scaffold(
                  body: Center(child: Text('Estetn Farja Mobile')),
                ),
              );
            }
          }
          EOF

      - name: Create Android TV Manifest
        run: |
          cat > client/android/app/src/tv/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.software.leanback"
                  android:required="true" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />
              <application
                  android:label="Estetn Farja TV">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create server files
        run: |
          cat > server/package.json <<'EOF'
          {
            "name": "estitn-farja-server",
            "version": "1.0.0",
            "main": "src/index.js",
            "scripts": {
              "start": "node src/index.js"
            },
            "dependencies": {
              "express": "^4.19.2"
            }
          }
          EOF
          cat > server/src/index.js <<'EOF'
          const express = require('express');
          const app = express();
          const PORT = process.env.PORT || 3000;
          app.get('/', (req, res) => res.json({ status: 'ok' }));
          app.listen(PORT, () => console.log('Server running on ' + PORT));
          EOF

      - name: Create data-pipeline files
        run: |
          cat > data-pipeline/requirements.txt <<'EOF'
          requests>=2.31.0
          aiohttp>=3.9.0
          m3u8>=4.0.0
          EOF

      - name: Create README and gitignore
        run: |
          cat > README.md <<'EOF'
          # Estetn Farja IPTV

          تطبيق IPTV احترافي يدعم Android TV و Google TV والهواتف.
          EOF
          cat > .gitignore <<'EOF'
          client/build/
          client/.dart_tool/
          client/.flutter-plugins
          client/.packages
          client/pubspec.lock
          server/node_modules/
          server/.env
          __pycache__/
          *.pyc
          data-pipeline/.venv/
          .idea/
          .vscode/
          *.iml
          .DS_Store
          Thumbs.db
          EOF

      - name: Create .gitkeep files
        run: |
          touch client/lib/core/constants/.gitkeep
          touch client/lib/core/theme/.gitkeep
          touch client/lib/core/utils/.gitkeep
          touch client/lib/data/models/.gitkeep
          touch client/lib/data/repositories/.gitkeep
          touch client/lib/data/providers/.gitkeep
          touch client/lib/features/live_tv/.gitkeep
          touch client/lib/features/movies/.gitkeep
          touch client/lib/features/series/.gitkeep
          touch client/lib/features/player/.gitkeep
          touch client/lib/tv/screens/.gitkeep
          touch client/lib/tv/widgets/.gitkeep
          touch client/lib/tv/navigation/.gitkeep
          touch server/src/routes/.gitkeep
          touch server/src/middleware/.gitkeep
          touch server/src/config/.gitkeep
          touch data-pipeline/scripts/.gitkeep
          touch data-pipeline/sources/.gitkeep
          touch shared/.gitkeep
          touch docs/.gitkeep

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: setup project structure" || echo "No changes"
          git push
