name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build_mobile.yml'

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-write-only: false

      - name: Generate Android platform
        run: |
          cd /tmp
          flutter create --platforms=android --org com.estitn --project-name estitn_farja --no-pub temp_app
          rm -rf "$GITHUB_WORKSPACE/client/android"
          cp -r /tmp/temp_app/android "$GITHUB_WORKSPACE/client/android"
          echo "Copied android folder"

      - name: Pin Kotlin + AGP versions in settings.gradle.kts
        run: |
          FILE="$GITHUB_WORKSPACE/client/android/settings.gradle.kts"
          cat > "$FILE" <<'KOTLINEOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
                  maven { url = uri("https://maven.aliyun.com/repository/public") }
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.21" apply false
          }

          include(":app")
          KOTLINEOF
          echo "Pinned Kotlin 2.2.21 + AGP 8.7.0 with mirrors"

      - name: Pin Gradle 8.10.2 in wrapper
        run: |
          FILE="$GITHUB_WORKSPACE/client/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$FILE" ]; then
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.10.2-all.zip|' "$FILE"
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.10.2-bin.zip|' "$FILE"
            cat "$FILE"
          else
            mkdir -p "$(dirname "$FILE")"
            cat > "$FILE" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          EOF
          fi

      - name: Auto-fix Dart files
        run: |
          find client/lib -name "*.dart" | while read f; do
            if grep -q "KeyDownEvent" "$f"; then
              if ! grep -q "package:flutter/services.dart" "$f"; then
                sed -i "1i import 'package:flutter/services.dart';" "$f"
              fi
            fi
          done

      - name: Install unrar and 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unrar-free p7zip-full || true

      - name: Check uploaded assets
        run: ls -lh client/assets/android_res/ || true

      - name: Extract archive
        run: |
          BASE="client/assets/android_res"
          mkdir -p "$BASE/extracted"
          ARCHIVE=$(find "$BASE" -maxdepth 1 \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then echo "no archive found"; exit 0; fi
          if [ "${ARCHIVE##*.}" = "zip" ]; then
            unzip -o "$ARCHIVE" -d "$BASE/extracted"
          elif [ "${ARCHIVE##*.}" = "rar" ]; then
            unrar x -o+ "$ARCHIVE" "$BASE/extracted/" || 7z x "$ARCHIVE" -o"$BASE/extracted" -y
          else
            7z x "$ARCHIVE" -o"$BASE/extracted" -y
          fi

      - name: Detect res folder
        id: locate_res
        run: |
          BASE="client/assets/android_res"
          RES_PATH=""
          if [ -d "$BASE/extracted/res" ]; then RES_PATH="$BASE/extracted/res"
          elif [ -d "$BASE/extracted/mipmap-hdpi" ]; then RES_PATH="$BASE/extracted"
          elif [ -d "$BASE/res" ]; then RES_PATH="$BASE/res"
          elif [ -d "$BASE/mipmap-hdpi" ]; then RES_PATH="$BASE"
          fi
          echo "RES_PATH=$RES_PATH" >> $GITHUB_OUTPUT

      - name: Merge custom res into Flutter res
        run: |
          RES_SRC="${{ steps.locate_res.outputs.RES_PATH }}"
          RES_DEST="client/android/app/src/main/res"
          if [ -z "$RES_SRC" ]; then echo "no custom res"; exit 0; fi
          cp -r "$RES_SRC"/* "$RES_DEST/" 2>/dev/null || true

      - name: Ensure LaunchTheme and NormalTheme exist
        run: |
          RES_DEST="client/android/app/src/main/res"
          VALUES_DIR="$RES_DEST/values"
          mkdir -p "$VALUES_DIR"
          STYLES_FILE="$VALUES_DIR/styles.xml"
          if [ ! -f "$STYLES_FILE" ]; then
            cat > "$STYLES_FILE" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          else
            if ! grep -q 'name="LaunchTheme"' "$STYLES_FILE"; then
              sed -i 's|</resources>|    <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">@android:color/white</item></style>\n</resources>|' "$STYLES_FILE"
            fi
            if ! grep -q 'name="NormalTheme"' "$STYLES_FILE"; then
              sed -i 's|</resources>|    <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">?android:colorBackground</item></style>\n</resources>|' "$STYLES_FILE"
            fi
          fi

      - name: Create network security config (HTTP + HTTPS)
        run: |
          XML_DIR="client/android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cat > "$XML_DIR/network_security_config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
              </domain-config>
          </network-security-config>
          EOF
          echo "Created enhanced network security config"

      - name: Patch all splash screen resources
        run: |
          RES_DEST="client/android/app/src/main/res"
          if [ -d "$RES_DEST/values-v31" ]; then
            rm -rf "$RES_DEST/values-v31"
          fi
          find "$RES_DEST" -type f -name "*.xml" | while read f; do
            sed -i 's|parent="Theme.SplashScreen"|parent="@android:style/Theme.Light.NoTitleBar"|g' "$f"
            sed -i '/windowSplashScreenBackground/d' "$f"
            sed -i '/windowSplashScreenAnimatedIcon/d' "$f"
            sed -i '/windowSplashScreenAnimationDuration/d' "$f"
            sed -i '/windowSplashScreenIconBackgroundColor/d' "$f"
            sed -i '/postSplashScreenTheme/d' "$f"
          done

      - name: Generate encrypted config
        env:
          PLAYLIST_URLS: ${{ secrets.PLAYLIST_URLS }}
        run: |
          mkdir -p client/lib/data/local
          python3 client/scripts/gen_config.py > client/lib/data/local/secure_config.dart

      - name: Verify URLs
        run: |
          count=$(grep -c "^\s*\['" client/lib/data/local/secure_config.dart || echo 0)
          if [ "$count" -lt 1 ]; then echo "ERROR: no URLs"; exit 1; fi

      - name: Bump minSdkVersion to 23
        working-directory: client
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/' android/app/build.gradle.kts
          fi

      - name: Patch build.gradle (ABIs + packaging)
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os
          KTS_NDK = "\nndk { abiFilters += listOf(\"arm64-v8a\", \"armeabi-v7a\") }\n"
          GR_NDK = "\nndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }\n"
          KTS_PACK = "\npackaging {\n    jniLibs { useLegacyPackaging = true }\n    resources { excludes += setOf(\"META-INF/*.kotlin_module\") }\n}\n"
          GR_PACK = "\npackagingOptions {\n    jniLibs { useLegacyPackaging = true }\n    resources { excludes += ['META-INF/*.kotlin_module'] }\n}\n"
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path): continue
              src = open(path, "r", encoding="utf-8").read()
              is_kts = path.endswith(".kts")
              if "abiFilters" not in src and "defaultConfig {" in src:
                  i = src.find("defaultConfig {") + len("defaultConfig {")
                  src = src[:i] + (KTS_NDK if is_kts else GR_NDK) + src[i:]
              if "packagingOptions" not in src and "packaging {" not in src and "android {" in src:
                  i = src.find("android {") + len("android {")
                  src = src[:i] + (KTS_PACK if is_kts else GR_PACK) + src[i:]
              open(path, "w", encoding="utf-8").write(src)
          PYEOF

      - name: Enable Core Library Desugaring
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os
          KTS_DEP = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
          GR_DEP = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          KTS_CMP = "\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
          GR_CMP = "\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n"
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path): continue
              src = open(path, "r", encoding="utf-8").read()
              is_kts = path.endswith(".kts")
              dep = KTS_DEP if is_kts else GR_DEP
              cmp = KTS_CMP if is_kts else GR_CMP
              if "desugar_jdk_libs" not in src:
                  if "dependencies {" in src:
                      i = src.find("dependencies {") + len("dependencies {")
                      src = src[:i] + "\n    " + dep + src[i:]
                  else:
                      src = src.rstrip() + "\n\ndependencies {\n    " + dep + "\n}\n"
              flag = "isCoreLibraryDesugaringEnabled" if is_kts else "coreLibraryDesugaringEnabled"
              if flag not in src:
                  if "compileOptions {" in src:
                      if is_kts:
                          src = src.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                      else:
                          src = src.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  elif "android {" in src:
                      i = src.find("android {") + len("android {")
                      src = src[:i] + cmp + src[i:]
              open(path, "w", encoding="utf-8").write(src)
          PYEOF

      - name: Override AndroidManifest (Mobile)
        working-directory: client
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.estitn.estitn_farja">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <application
                  android:label="استيتن فرجة"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>
          XMLEOF

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Mobile APK
        working-directory: client
        run: flutter build apk --release -t lib/main_mobile.dart --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp client/build/app/outputs/flutter-apk/app-release.apk artifacts/estitn-farja-mobile.apk || true
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: estitn-farja-mobile-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/client/lib/data/local/secure_config.dart" || true
          echo "Cleanup done"
