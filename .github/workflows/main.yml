build-tv:
  name: 📺 Build Android TV
  runs-on: ubuntu-latest
  needs: quality-check
  if: |
    always() && 
    (needs.quality-check.result == 'success' || needs.quality-check.result == 'skipped')
  steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔍 Check if client exists
      id: check-client
      run: |
        if [ -d "client" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::مجلد client غير موجود، سيتم تجاوز البناء"
        fi

    - name: ☕ Setup Java
      if: steps.check-client.outputs.exists == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 🎯 Setup Flutter
      if: steps.check-client.outputs.exists == 'true'
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: 📦 Dependencies
      if: steps.check-client.outputs.exists == 'true'
      working-directory: client
      run: flutter pub get

    - name: 🏗️ Build TV APK
      if: steps.check-client.outputs.exists == 'true'
      working-directory: client
      run: flutter build apk --flavor tv -t lib/main_tv.dart --release

    - name: 📤 Upload TV APK
      if: steps.check-client.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: estitn-farja-tv-${{ github.sha }}
        path: client/build/app/outputs/flutter-apk/app-tv-release.apk
        retention-days: 30
