name: Update Remote Playlists

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate encrypted file
        env:
          PLAYLIST_URLS: ${{ secrets.PLAYLIST_URLS }}
        run: |
          mkdir -p client/assets/remote
          python3 client/scripts/generate_remote.py > client/assets/remote/playlists.enc
          echo "Generated playlists.enc"
          wc -c client/assets/remote/playlists.enc

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/assets/remote/playlists.enc
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Update playlists.enc"
          git push
