name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/build_tv.yml'

permissions:
  contents: write

jobs:
  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform
        working-directory: client
        run: |
          flutter create --platforms=android --org com.estitn --project-name estitn_farja --no-pub .

      - name: Verify android created
        working-directory: client
        run: |
          ls -la
          echo "---"
          ls -la android || echo "android missing"
          echo "---"
          ls -la android/app || echo "android/app missing"

      - name: Install unrar and 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unrar-free p7zip-full || true

      - name: Check uploaded assets
        run: |
          ls -lh client/assets/android_res/ || true

      - name: Extract archive
        run: |
          BASE="client/assets/android_res"
          mkdir -p "$BASE/extracted"
          ARCHIVE=$(find "$BASE" -maxdepth 1 \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "no archive found"
            exit 1
          fi
          echo "Archive: $ARCHIVE"
          if [ "${ARCHIVE##*.}" = "zip" ]; then
            unzip -o "$ARCHIVE" -d "$BASE/extracted"
          elif [ "${ARCHIVE##*.}" = "rar" ]; then
            unrar x -o+ "$ARCHIVE" "$BASE/extracted/" || 7z x "$ARCHIVE" -o"$BASE/extracted" -y
          else
            7z x "$ARCHIVE" -o"$BASE/extracted" -y
          fi
          find "$BASE/extracted" -type f | head -40 || true

      - name: Detect res folder
        id: locate_res
        run: |
          BASE="client/assets/android_res"
          RES_PATH=""
          if [ -d "$BASE/extracted/res" ]; then
            RES_PATH="$BASE/extracted/res"
          elif [ -d "$BASE/extracted/mipmap-hdpi" ]; then
            RES_PATH="$BASE/extracted"
          elif [ -d "$BASE/res" ]; then
            RES_PATH="$BASE/res"
          elif [ -d "$BASE/mipmap-hdpi" ]; then
            RES_PATH="$BASE"
          fi
          echo "RES_PATH=$RES_PATH" >> $GITHUB_OUTPUT
          echo "Detected: $RES_PATH"

      - name: Replace Android res folder
        run: |
          RES_SRC="${{ steps.locate_res.outputs.RES_PATH }}"
          RES_DEST="client/android/app/src/main/res"
          if [ -z "$RES_SRC" ]; then
            echo "no custom res, using default"
            exit 0
          fi
          if [ ! -d "$RES_SRC" ]; then
            echo "res path not a directory"
            exit 0
          fi
          rm -rf "$RES_DEST"
          mkdir -p "$RES_DEST"
          cp -r "$RES_SRC"/* "$RES_DEST/"
          find "$RES_DEST" -type f | head -40 || true

      - name: Verify icon
        run: |
          if [ -f "client/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            echo "icon found"
          else
            echo "icon missing, using default"
          fi

      - name: Generate encrypted config
        env:
          PLAYLIST_URLS: ${{ secrets.PLAYLIST_URLS }}
        run: |
          mkdir -p client/lib/data/local
          python3 client/scripts/gen_config.py > client/lib/data/local/secure_config.dart
          echo "Generated secure_config.dart"

      - name: Verify URLs
        run: |
          count=$(grep -c "^\s*\['" client/lib/data/local/secure_config.dart || echo 0)
          echo "URLs: $count"
          if [ "$count" -lt 1 ]; then
            echo "ERROR: no URLs"
            exit 1
          fi
          echo "OK"

      - name: Bump minSdkVersion to 23
        working-directory: client
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle

      - name: Add packaging options
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          path = "android/app/build.gradle"
          src = open(path, "r", encoding="utf-8").read()
          if "packagingOptions" not in src:
              idx = src.find("android {")
              if idx != -1:
                  insert_at = idx + len("android {")
                  block = """

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
                  resources {
                      excludes += ['META-INF/*.kotlin_module']
                  }
              }
          """
                  src = src[:insert_at] + block + src[insert_at:]
          open(path, "w", encoding="utf-8").write(src)
          PYEOF

      - name: Override AndroidManifest
        working-directory: client
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:label="استيتن فرجة"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          XMLEOF

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Build APK
        working-directory: client
        run: |
          flutter build apk --release -t lib/main_tv.dart --split-per-abi --android-skip-build-dependency-validation

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/estitn-farja-tv-arm64.apk || true
          cp client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/estitn-farja-tv-arm32.apk || true
          cp client/build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/estitn-farja-tv-x86_64.apk || true
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: estitn-farja-tv-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f client/lib/data/local/secure_config.dart
