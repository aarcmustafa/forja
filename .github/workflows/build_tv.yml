name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/build_tv.yml'

permissions:
  contents: write

jobs:
  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform
        working-directory: client
        run: |
          flutter create --platforms=android --org com.estitn --project-name estitn_farja .

      # ==========================================================
      #  🎨 استبدال res بالأيقونة + Splash
      # ==========================================================
      - name: Install unrar + 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unrar-free p7zip-full || true

      - name: Check uploaded assets
        run: |
          echo "=== محتويات assets/android_res ==="
          ls -lh client/assets/android_res/ || true
          echo ""
          echo "=== البحث عن أرشيف ==="
          find client/assets/android_res -maxdepth 1 \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) 2>/dev/null || true

      - name: Extract archive
        run: |
          BASE="client/assets/android_res"
          mkdir -p "$BASE/extracted"

          ARCHIVE=$(find "$BASE" -maxdepth 1 \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) 2>/dev/null | head -1)

          if [ -z "$ARCHIVE" ]; then
            echo "❌ لا يوجد ملف أرشيف"
            exit 1
          fi

          echo "📦 الأرشيف: $ARCHIVE"
          echo "📏 الحجم: $(stat -c%s "$ARCHIVE") bytes"
          echo ""

          if [[ "$ARCHIVE" == *.zip ]]; then
            if unzip -t "$ARCHIVE" > /dev/null 2>&1; then
              echo "✅ ZIP صالح → الفك"
              unzip -o "$ARCHIVE" -d "$BASE/extracted"
            else
              echo "❌ ZIP تالف"
              exit 1
            fi

          elif [[ "$ARCHIVE" == *.rar ]]; then
            echo "🔄 محاولة فك RAR..."
            if unrar x -o+ "$ARCHIVE" "$BASE/extracted/" 2>&1; then
              echo "✅ RAR فُكّ بنجاح"
            elif 7z x "$ARCHIVE" -o"$BASE/extracted" -y 2>&1; then
              echo "✅ RAR فُكّ بواسطة 7z"
            else
              echo "❌ فشل فك RAR"
              exit 1
            fi

          elif [[ "$ARCHIVE" == *.7z ]]; then
            echo "🔄 محاولة فك 7z..."
            if 7z x "$ARCHIVE" -o"$BASE/extracted" -y 2>&1; then
              echo "✅ 7z فُكّ بنجاح"
            else
              echo "❌ فشل فك 7z"
              exit 1
            fi
          fi

          echo ""
          echo "=== محتويات بعد الفك ==="
          find "$BASE/extracted" -type f | head -40

      - name: Detect res folder
        id: locate_res
        run: |
          BASE="client/assets/android_res"

          if [ -d "$BASE/extracted/res" ]; then
            echo "RES_PATH=$BASE/extracted/res" >> $GITHUB_OUTPUT
            echo "✅ وجدت res في extracted/res"
          elif [ -d "$BASE/extracted/mipmap-hdpi" ] || [ -d "$BASE/extracted/drawable" ]; then
            echo "RES_PATH=$BASE/extracted" >> $GITHUB_OUTPUT
            echo "✅ extracted هو res"
          elif [ -d "$BASE/res" ]; then
            echo "RES_PATH=$BASE/res" >> $GITHUB_OUTPUT
            echo "✅ وجدت res في BASE/res"
          elif [ -d "$BASE/mipmap-hdpi" ] || [ -d "$BASE/drawable" ]; then
            echo "RES_PATH=$BASE" >> $GITHUB_OUTPUT
            echo "✅ BASE هو res"
          else
            echo "RES_PATH=" >> $GITHUB_OUTPUT
            echo "❌ لم أجد مجلد res"
            echo ""
            echo "=== محتويات extracted ==="
            ls -la "$BASE/extracted/" || true
            echo ""
            echo "=== بحث عميق عن mipmap ==="
            find "$BASE" -type d -name "mipmap*" 2>/dev/null || true
          fi
          
- name: Replace Android res folder
  run: |
    RES_SRC="${{ steps.locate_res.outputs.RES_PATH }}"
    RES_DEST="client/android/app/src/main/res"

    if [ -z "$RES_SRC" ] || [ ! -d "$RES_SRC" ]; then
      echo "⚠️ لم أجد res مخصص — سيتم استخدام الافتراضية"
      exit 0
    fi

    echo "📦 المصدر: $RES_SRC"
    echo "📦 الهدف: $RES_DEST"

    rm -rf "$RES_DEST"
    mkdir -p "$RES_DEST"

    cp -r "$RES_SRC"/* "$RES_DEST/" 2>/dev/null || true

    echo ""
    echo "=== محتويات res النهائية ==="
    find "$RES_DEST" -type f | head -40

- name: Verify icon
  run: |
    RES_DEST="client/android/app/src/main/res"

    if [ -f "$RES_DEST/mipmap-xxxhdpi/ic_launcher.png" ]; then
      SIZE=$(stat -c%s "$RES_DEST/mipmap-xxxhdpi/ic_launcher.png")
      echo "✅ ic_launcher.png موجود (${SIZE} bytes)"
    else
      echo "⚠️ ic_launcher.png غير موجود — سيُستخدم الافتراضي"
    fi

    if ls "$RES_DEST"/drawable/splash* 1> /dev/null 2>&1; then
      echo "✅ ملفات splash موجودة"
    else
      echo "⚠️ ملفات splash غير موجودة"
    fi

# ==========================================================
#  🔐 توليد secure_config
# ==========================================================
- name: Generate encrypted config
  env:
    PLAYLIST_URLS: ${{ secrets.PLAYLIST_URLS }}
  run: |
    mkdir -p client/lib/data/local

    python3 << 'PY'
    import os
    import base64

    key = bytes([
        0x7A, 0x3F, 0x91, 0x2C, 0xE5, 0x88, 0x4B, 0xD6,
        0x13, 0x6A, 0xBF, 0x50, 0x27, 0x9E, 0xC4, 0x71,
        0xA2, 0x5D, 0x38, 0x94, 0xCB, 0x1F, 0x66, 0xD9,
    ])

    urls_raw = os.environ.get('PLAYLIST_URLS', '')
    urls = [u.strip() for u in urls_raw.split('\n') if u.strip()]

    if not urls:
        print('❌ لا توجد روابط')
        exit(1)

    lines = []
    lines.append("import 'dart:convert';")
    lines.append('')
    lines.append('/// بيانات مشفّرة')
    lines.append('class SecureConfig {')
    lines.append('  static const List<int> _k = [')
    lines.append('    ' + ', '.join(f'0x{b:02X}' for b in key) + ',')
    lines.append('  ];')
    lines.append('')
    lines.append('  static const List<List<String>> _parts = [')

    for url in urls:
        url_bytes = url.encode('utf-8')
        xored = bytes([url_bytes[i] ^ key[i % len(key)] for i in range(len(url_bytes))])
        b64 = base64.b64encode(xored).decode('ascii')
        n = len(b64)
        chunk = (n + 2) // 3
        parts = [b64[i:i+chunk] for i in range(0, n, chunk)]
        while len(parts) < 3:
            parts.append('')
        lines.append("    ['" + "', '".join(parts) + "'],")

    lines.append('  ];')
    lines.append('')
    lines.append('  static String _decode(List<String> p) {')
    lines.append('    try {')
    lines.append('      final bytes = base64Decode(p.join());')
    lines.append('      final out = <int>[];')
    lines.append('      for (int i = 0; i < bytes.length; i++) {')
    lines.append('        out.add(bytes[i] ^ _k[i % _k.length]);')
    lines.append('      }')
    lines.append('      return utf8.decode(out, allowMalformed: true);')
    lines.append('    } catch (_) {')
    lines.append("      return '';")
    lines.append('    }')
    lines.append('  }')
    lines.append('')
    lines.append('  static List<String> getPlaylistUrls() {')
    lines.append('    final r = <String>[];')
    lines.append('    for (final p in _parts) {')
    lines.append('      final u = _decode(p);')
    lines.append('      if (u.isNotEmpty) r.add(u);')
    lines.append('    }')
    lines.append('    return r;')
    lines.append('  }')
    lines.append('')
    lines.append('  static List<String>? _cache;')
    lines.append('  static List<String> get urls {')
    lines.append('    _cache ??= getPlaylistUrls();')
    lines.append('    return _cache!;')
    lines.append('  }')
    lines.append('}')

    with open('client/lib/data/local/secure_config.dart', 'w', encoding='utf-8') as f:
        f.write('\n'.join(lines))

    print(f'✓ تم توليد {len(urls)} روابط مشفّرة')
    PY

- name: Verify URLs
  run: |
    count=$(grep -c "^\s*\['" client/lib/data/local/secure_config.dart || echo 0)
    echo "✓ عدد الروابط: $count"
    if [ "$count" -lt 1 ]; then exit 1; fi
    
# ==========================================================
#  تعديلات AndroidManifest و build.gradle
# ==========================================================
- name: Bump minSdkVersion to 23
  working-directory: client
  run: |
    sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle

- name: Add packaging options
  working-directory: client
  run: |
    python3 - <<'PY'
    path = "android/app/build.gradle"
    src = open(path, "r", encoding="utf-8").read()
    if "packagingOptions" not in src:
        idx = src.find("android {")
        if idx != -1:
            insert_at = idx + len("android {")
            block = """

        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
            resources {
                excludes += ['META-INF/*.kotlin_module']
            }
        }
    """
            src = src[:insert_at] + block + src[insert_at:]
    open(path, "w", encoding="utf-8").write(src)
    PY

- name: Override AndroidManifest for TV
  working-directory: client
  run: |
    cat > android/app/src/main/AndroidManifest.xml <<'EOF'
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <uses-feature android:name="android.software.leanback" android:required="true" />
        <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
        <uses-feature android:name="android.hardware.gamepad" android:required="false" />
        <uses-permission android:name="android.permission.INTERNET" />
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
        <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
        <uses-permission android:name="android.permission.WAKE_LOCK" />
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
        <application
            android:label="استيتن فرجة"
            android:name="${applicationName}"
            android:icon="@mipmap/ic_launcher"
            android:roundIcon="@mipmap/ic_launcher_round"
            android:banner="@mipmap/ic_launcher"
            android:usesCleartextTraffic="true"
            android:requestLegacyExternalStorage="true"
            android:hardwareAccelerated="true">
            <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTop"
                android:theme="@style/LaunchTheme"
                android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                android:hardwareAccelerated="true"
                android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
            </activity>
            <meta-data android:name="flutterEmbedding" android:value="2" />
        </application>
    </manifest>
    EOF

- name: Get dependencies
  working-directory: client
  run: flutter pub get

- name: Build APK
  working-directory: client
  run: |
    flutter build apk --release \
      -t lib/main_tv.dart \
      --split-per-abi \
      --android-skip-build-dependency-validation

- name: Rename APKs
  run: |
    mkdir -p artifacts
    cp client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/estitn-farja-tv-arm64.apk || true
    cp client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/estitn-farja-tv-arm32.apk || true
    cp client/build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/estitn-farja-tv-x86_64.apk || true
    ls -lh artifacts/

- name: Upload APKs
  uses: actions/upload-artifact@v4
  with:
    name: estitn-farja-tv-apk
    path: artifacts/*.apk
    retention-days: 30

- name: Cleanup
  if: always()
  run: |
    rm -f client/lib/data/local/secure_config.dart
