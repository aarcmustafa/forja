name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build_tv.yml'

permissions:
  contents: write

jobs:
  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform
        run: |
          cd /tmp
          flutter create --platforms=android --org com.estitn --project-name estitn_farja --no-pub temp_app
          rm -rf "$GITHUB_WORKSPACE/client/android"
          cp -r /tmp/temp_app/android "$GITHUB_WORKSPACE/client/android"
          echo "Copied android folder"

      - name: Auto-fix Dart files (احتياطي)
        run: |
          echo "=== Fix 1: Add flutter/services import ==="
          find client/lib -name "*.dart" | while read f; do
            if grep -q "KeyDownEvent" "$f"; then
              if ! grep -q "package:flutter/services.dart" "$f"; then
                sed -i "1i import 'package:flutter/services.dart';" "$f"
                echo "Added import to: $f"
              fi
            fi
          done

      - name: Install unrar and 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unrar-free p7zip-full || true

      - name: Check uploaded assets
        run: ls -lh client/assets/android_res/ || true

      - name: Extract archive
        run: |
          BASE="client/assets/android_res"
          mkdir -p "$BASE/extracted"
          ARCHIVE=$(find "$BASE" -maxdepth 1 \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then echo "no archive found"; exit 0; fi
          echo "Archive: $ARCHIVE"
          if [ "${ARCHIVE##*.}" = "zip" ]; then
            unzip -o "$ARCHIVE" -d "$BASE/extracted"
          elif [ "${ARCHIVE##*.}" = "rar" ]; then
            unrar x -o+ "$ARCHIVE" "$BASE/extracted/" || 7z x "$ARCHIVE" -o"$BASE/extracted" -y
          else
            7z x "$ARCHIVE" -o"$BASE/extracted" -y
          fi
          find "$BASE/extracted" -type f | head -40 || true

      - name: Detect res folder
        id: locate_res
        run: |
          BASE="client/assets/android_res"
          RES_PATH=""
          if [ -d "$BASE/extracted/res" ]; then RES_PATH="$BASE/extracted/res"
          elif [ -d "$BASE/extracted/mipmap-hdpi" ]; then RES_PATH="$BASE/extracted"
          elif [ -d "$BASE/res" ]; then RES_PATH="$BASE/res"
          elif [ -d "$BASE/mipmap-hdpi" ]; then RES_PATH="$BASE"
          fi
          echo "RES_PATH=$RES_PATH" >> $GITHUB_OUTPUT
          echo "Detected: $RES_PATH"

      - name: Replace Android res folder
        run: |
          RES_SRC="${{ steps.locate_res.outputs.RES_PATH }}"
          RES_DEST="client/android/app/src/main/res"
          if [ -z "$RES_SRC" ]; then echo "no custom res"; exit 0; fi
          if [ ! -d "$RES_SRC" ]; then echo "not a directory"; exit 0; fi
          rm -rf "$RES_DEST"
          mkdir -p "$RES_DEST"
          cp -r "$RES_SRC"/* "$RES_DEST/"
          find "$RES_DEST" -type f | head -40 || true

      - name: Patch styles.xml (fix Theme.SplashScreen)
        run: |
          RES_DEST="client/android/app/src/main/res"
          echo "=== Patching styles.xml files ==="
          find "$RES_DEST" -name "styles.xml" | while read f; do
            echo "Patching: $f"
            sed -i 's|parent="Theme.SplashScreen"|parent="android:Theme.Black.NoTitleBar"|g' "$f"
            sed -i '/windowSplashScreenBackground/d' "$f"
            sed -i '/windowSplashScreenAnimatedIcon/d' "$f"
            sed -i '/windowSplashScreenAnimationDuration/d' "$f"
            sed -i '/windowSplashScreenIconBackgroundColor/d' "$f"
            sed -i '/postSplashScreenTheme/d' "$f"
          done

      - name: Patch values-v31 folder
        run: |
          RES_DEST="client/android/app/src/main/res"
          if [ -d "$RES_DEST/values-v31" ]; then
            echo "=== Found values-v31 ==="
            find "$RES_DEST/values-v31" -name "*.xml" | while read f; do
              echo "Patching: $f"
              sed -i 's|parent="Theme.SplashScreen"|parent="android:Theme.Black.NoTitleBar"|g' "$f"
              sed -i '/windowSplashScreenBackground/d' "$f"
              sed -i '/windowSplashScreenAnimatedIcon/d' "$f"
              sed -i '/windowSplashScreenAnimationDuration/d' "$f"
              sed -i '/windowSplashScreenIconBackgroundColor/d' "$f"
              sed -i '/postSplashScreenTheme/d' "$f"
            done
          fi

      - name: Generate encrypted config
        env:
          PLAYLIST_URLS: ${{ secrets.PLAYLIST_URLS }}
        run: |
          mkdir -p client/lib/data/local
          python3 client/scripts/gen_config.py > client/lib/data/local/secure_config.dart
          echo "Generated secure_config.dart"

      - name: Verify URLs
        run: |
          count=$(grep -c "^\s*\['" client/lib/data/local/secure_config.dart || echo 0)
          echo "URLs: $count"
          if [ "$count" -lt 1 ]; then echo "ERROR: no URLs"; exit 1; fi
          echo "OK"

      - name: Bump minSdkVersion to 23
        working-directory: client
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            echo "updated build.gradle"
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/' android/app/build.gradle.kts
            echo "updated build.gradle.kts"
          fi

      - name: Limit ABIs to arm64 plus armv7
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if not os.path.exists(path): continue
              src = open(path, "r", encoding="utf-8").read()
              if "abiFilters" in src:
                  print(f"abiFilters already in {path}")
                  continue
              marker = "defaultConfig {"
              idx = src.find(marker)
              if idx == -1:
                  print(f"defaultConfig not in {path}")
                  continue
              insert_at = idx + len(marker)
              if path.endswith(".kts"):
                  block = """
          ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
          """
              else:
                  block = """
          ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
          """
              src = src[:insert_at] + block + src[insert_at:]
              open(path, "w", encoding="utf-8").write(src)
              print(f"updated {path}")
          PYEOF

      - name: Add packaging options
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if not os.path.exists(path): continue
              src = open(path, "r", encoding="utf-8").read()
              if "packagingOptions" in src or "packaging {" in src:
                  print(f"already in {path}")
                  continue
              marker = "android {"
              idx = src.find(marker)
              if idx == -1: continue
              insert_at = idx + len(marker)
              if path.endswith(".kts"):
                  block = """
          packaging {
              jniLibs { useLegacyPackaging = true }
              resources { excludes += setOf("META-INF/*.kotlin_module") }
          }
          """
              else:
                  block = """
          packagingOptions {
              jniLibs { useLegacyPackaging = true }
              resources { excludes += ['META-INF/*.kotlin_module'] }
          }
          """
              src = src[:insert_at] + block + src[insert_at:]
              open(path, "w", encoding="utf-8").write(src)
              print(f"updated {path}")
          PYEOF

      - name: Add AndroidX SplashScreen dependency
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if not os.path.exists(path): continue
              src = open(path, "r", encoding="utf-8").read()
              if "core-splashscreen" in src:
                  print(f"already in {path}")
                  continue
              marker = "dependencies {"
              idx = src.find(marker)
              if idx == -1:
                  print(f"dependencies not in {path}")
                  continue
              insert_at = idx + len(marker)
              if path.endswith(".kts"):
                  block = """
          implementation("androidx.core:core-splashscreen:1.0.1")
          """
              else:
                  block = """
          implementation 'androidx.core:core-splashscreen:1.0.1'
          """
              src = src[:insert_at] + block + src[insert_at:]
              open(path, "w", encoding="utf-8").write(src)
              print(f"updated {path}")
          PYEOF

      - name: Enable Core Library Desugaring
        working-directory: client
        run: |
          python3 - <<'PYEOF'
          import os

          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]
          for path in candidates:
              if not os.path.exists(path):
                  continue

              src = open(path, "r", encoding="utf-8").read()
              is_kts = path.endswith(".kts")

              dep_line = (
                  'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
                  if is_kts
                  else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
              )

              if "desugar_jdk_libs" not in src:
                  if "dependencies {" in src:
                      idx = src.find("dependencies {")
                      insert_at = idx + len("dependencies {")
                      src = src[:insert_at] + "\n    " + dep_line + src[insert_at:]
                      print(f"[1] Added desugar dependency to existing dependencies block in {path}")
                  else:
                      src = src.rstrip() + f"\n\ndependencies {{\n    {dep_line}\n}}\n"
                      print(f"[1] Created new dependencies block in {path}")
              else:
                  print(f"[1] desugar_jdk_libs already present in {path}")

              if is_kts:
                  if "isCoreLibraryDesugaringEnabled" not in src:
                      if "compileOptions {" in src:
                          src = src.replace(
                              "compileOptions {",
                              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                              1,
                          )
                          print(f"[2] Patched existing compileOptions in {path}")
                      elif "android {" in src:
                          idx = src.find("android {")
                          insert_at = idx + len("android {")
                          block = """
    compileOptions {
        isCoreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
"""
                          src = src[:insert_at] + block + src[insert_at:]
                          print(f"[2] Created compileOptions in {path}")
                  else:
                      print(f"[2] isCoreLibraryDesugaringEnabled already present in {path}")
              else:
                  if "coreLibraryDesugaringEnabled" not in src:
                      if "compileOptions {" in src:
                          src = src.replace(
                              "compileOptions {",
                              "compileOptions {\n        coreLibraryDesugaringEnabled true",
                              1,
                          )
                          print(f"[2] Patched existing compileOptions in {path}")
                      elif "android {" in src:
                          idx = src.find("android {")
                          insert_at = idx + len("android {")
                          block = """
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
"""
                          src = src[:insert_at] + block + src[insert_at:]
                          print(f"[2] Created compileOptions in {path}")
                  else:
                      print(f"[2] coreLibraryDesugaringEnabled already present in {path}")

              open(path, "w", encoding="utf-8").write(src)
              print(f"[OK] Saved {path}")
          PYEOF

      - name: Override AndroidManifest (TV)
        working-directory: client
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.estitn.estitn_farja">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <application
                  android:label="استيتن فرجة TV"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>
          XMLEOF

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Build APK
        working-directory: client
        run: flutter build apk --release -t lib/main_tv.dart --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp client/build/app/outputs/flutter-apk/app-release.apk artifacts/estitn-farja-tv.apk || true
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: estitn-farja-tv-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/client/lib/data/local/secure_config.dart" || true
          echo "Cleanup done"
